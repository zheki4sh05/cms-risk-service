server:
  port: 9094

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cms-risk-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:cms-risk-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

logging:
  level:
    com.trustflow.cms_risk_service: DEBUG

app:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:9091}
  monitoring-service:
    base-url: ${MONITORING_SERVICE_BASE_URL:http://localhost:9093}
  risk-object-service:
    base-url: ${RISK_OBJECT_SERVICE_BASE_URL:http://localhost:9093}
  monitoring-processing:
    fixed-delay-ms: ${MONITORING_PROCESSING_DELAY_MS:5000}
  rules-history:
    cleanup:
      retention-days: ${RULES_HISTORY_RETENTION_DAYS:30}
      cron: ${RULES_HISTORY_CLEANUP_CRON:0 0 3 * * *}
  kafka:
    topics:
      risk-topic: ${KAFKA_RISK_TOPIC:risk_topic}
      incident-topic: ${KAFKA_INCIDENT_TOPIC:incident_topic}
  security:
    jwt:
      public-key: ${JWT_PUBLIC_KEY:}
